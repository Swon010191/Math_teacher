name: package-windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build frontend + backend exe + launcher
        working-directory: Math_teacher
        run: |
          cd backend
          python -m venv .venv
          .\.venv\Scripts\python -m pip install -U pip pyinstaller pystray pillow
          .\.venv\Scripts\python -m pip install -r requirements.txt
          cd ..\frontend
          npm ci
          npm run build
          $StaticDir = "..\backend\app\static"
          if (Test-Path $StaticDir) { Remove-Item $StaticDir -Recurse -Force }
          New-Item -ItemType Directory $StaticDir | Out-Null
          Copy-Item "dist\*" $StaticDir -Recurse -Force
          cd ..\backend
          .\.venv\Scripts\python -m PyInstaller --noconfirm --clean --onedir --name MathBackend `
            --paths "$PWD" `
            --add-data "$PWD\app\static;app/static" `
            --collect-all uvicorn --hidden-import dotenv `
            "$PWD\..\packaging\server_main.py"
          cd ..\packaging
          ..\backend\.venv\Scripts\python -m PyInstaller --noconfirm --clean --onefile --noconsole `
            --name AI-Teaching-Assistant `
            --hidden-import pystray --hidden-import PIL launcher.py
        shell: pwsh

      - name: Compile Setup.exe
        working-directory: Math_teacher/packaging
        run: |
          New-Item -ItemType Directory stage\tools -Force | Out-Null
          Copy-Item ..\backend\dist\MathBackend\* stage\backend -Recurse -Force
          Copy-Item dist\AI-Teaching-Assistant.exe stage -Force
          Copy-Item setup_pix2text.bat stage -Force
          Invoke-WebRequest -Uri 'https://github.com/astral-sh/uv/releases/latest/download/uv-x86_64-pc-windows-msvc.zip' -OutFile "$env:TEMP\uv-win.zip"
          Expand-Archive "$env:TEMP\uv-win.zip" "$env:TEMP\uv-win" -Force
          Copy-Item "$env:TEMP\uv-win\uv.exe" stage\tools -Force
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' app.iss
        shell: pwsh

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Setup-AI-Teaching-Assistant
          path: Math_teacher/packaging/output/Setup-*.exe
